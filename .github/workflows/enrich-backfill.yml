name: Enrich backfill trickle

# Drains the metadata-enrichment worklist in small batches instead of one daily
# burst. `enrich:backfill` costs exactly one Spotify call per track and aborts
# on a 429 whose retry-after exceeds 120s (the daily/abuse cap), so a run that
# finds the quota spent exits in seconds rather than burning runner minutes.
#
# Schedule drift does not matter here: a missed run enriches later and loses
# nothing, unlike sync-recently-played which was moved to pg_cron because gaps
# dropped listening events.

on:
  schedule:
    # Every 3 hours. Eight attempts a day; whichever land inside quota do work.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max tracks to enrich in this run'
        required: false
        default: '40'
      concurrency:
        description: 'Parallel Spotify requests'
        required: false
        default: '2'

permissions:
  contents: read

# Shared with enrich-metadata.yml: the two jobs draw on the same Spotify quota
# and must never run at the same time.
concurrency:
  group: spotify-metadata
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm enrich:backfill --limit=${{ inputs.limit || '40' }} --concurrency=${{ inputs.concurrency || '2' }} --trigger=${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
